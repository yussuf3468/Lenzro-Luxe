<!-- Android App Icon - 192x192 -->
<svg
  width="192"
  height="192"
  viewBox="0 0 192 192"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Background gradient -->
  <rect width="192" height="192" rx="43" fill="url(#androidGradient)" />
  
  <!-- Pattern overlay -->
  <rect
    width="192"
    height="192"
    rx="43"
    fill="url(#androidShimmer)"
    opacity="0.15"
  />
  
  <!-- L letter -->
  <path
    d="M53 45H82V128H128V157H53V45Z"
    fill="white"
    stroke="url(#androidGold)"
    stroke-width="1.5"
  />
  
  <!-- Crown accent -->
  <g transform="translate(138, 38)">
    <path d="M7.5 0L11 7.5L7.5 15L4 7.5Z" fill="url(#androidDiamond)" />
    <circle cx="7.5" cy="7.5" r="5.5" fill="#FDE68A" opacity="0.5" />
  </g>
  
  <!-- Sparkles -->
  <circle cx="45" cy="56" r="1.6" fill="#FCD34D" opacity="0.8" />
  <circle cx="142" cy="131" r="1.9" fill="#FDE68A" opacity="0.8" />
  <circle cx="60" cy="142" r="1.3" fill="#FCD34D" opacity="0.8" />
  <circle cx="145" cy="72" r="1.5" fill="#FDE68A" opacity="0.8" />
  
  <defs>
    <linearGradient id="androidGradient" x1="0" y1="0" x2="192" y2="192">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="35%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <radialGradient id="androidShimmer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="androidGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <linearGradient id="androidDiamond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FCD34D" />
