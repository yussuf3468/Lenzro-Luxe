<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/svg+xml" href="/lenzro-icon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/lenzro-icon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/lenzro-icon-192.png"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/lenzro-icon-180.png" />

    <!-- Primary Meta Tags -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#D97706" />
    <title>Lenzro Luxe — Premium Fashion & Luxury Clothing Brand</title>
    <meta
      name="description"
      content="Discover Lenzro Luxe — Your destination for premium fashion, luxury clothing, and exclusive designer collections. Shop trendy outfits for men, women, and kids. Free delivery, authentic products, 100% quality guaranteed."
    />
    <meta
      name="keywords"
      content="luxury fashion, premium clothing, designer outfits, Lenzro Luxe, trendy fashion, exclusive collections, men's fashion, women's fashion, kids fashion, online boutique"
    />
    <meta name="author" content="Lenzro Luxe" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="https://lenzroluxe.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lenzroluxe.com" />
    <meta
      property="og:title"
      content="Lenzro Luxe — Premium Fashion & Luxury Clothing Brand"
    />
    <meta
      property="og:description"
      content="Discover premium fashion and luxury clothing at Lenzro Luxe. Exclusive designer collections with free delivery and 100% authentic products."
    />
    <meta property="og:image" content="https://lenzroluxe.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Lenzro Luxe" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://lenzroluxe.com" />
    <meta
      name="twitter:title"
      content="Lenzro Luxe — Premium Fashion & Luxury Clothing"
    />
    <meta
      name="twitter:description"
      content="Shop exclusive designer collections at Lenzro Luxe. Premium fashion for men, women & kids. Free delivery & authentic products."
    />
    <meta
      name="twitter:image"
      content="https://lenzroluxe.com/twitter-image.jpg"
    />
    <meta name="twitter:creator" content="@LenzroLuxe" />

    <!-- Additional SEO -->
    <meta name="application-name" content="Lenzro Luxe" />
    <meta name="apple-mobile-web-app-title" content="Lenzro Luxe" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />

    <!-- App manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="privacy-policy" href="/privacy.html" />

    <!-- Preconnect to CDNs for performance -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://videos.pexels.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://videos.pexels.com" />

    <!-- JSON-LD Schema for Fashion Store -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "name": "Lenzro Luxe",
        "description": "Premium fashion and luxury clothing brand offering exclusive designer collections for men, women, and kids.",
        "url": "https://lenzroluxe.com",
        "logo": "https://lenzroluxe.com/lenzro-icon-192.png",
        "image": "https://lenzroluxe.com/og-image.jpg",
        "telephone": "+254-722-740-442",
        "email": "hello@lenzroluxe.com",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "KE",
          "addressLocality": "Nairobi"
        },
        "priceRange": "KES 500 - KES 50000",
        "paymentAccepted": "Cash, M-Pesa, Credit Card",
        "openingHours": "Mo-Su 08:00-22:00",
        "sameAs": [
          "https://www.facebook.com/lenzroluxe",
          "https://www.instagram.com/lenzroluxe",
          "https://twitter.com/lenzroluxe"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
